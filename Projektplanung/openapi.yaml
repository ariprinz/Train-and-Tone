openapi: 3.1.0
info:
  title: Train and Tone API
  version: 0.1.0
  description: |
    API-Vertrag für das Diplomprojekt "Train and Tone" (Pilates-Studio Wien).
    Entwurf v0.1 vom 23.11.2026, Umfang: MVP (US-01 bis US-08).

    Konventionen:
    - Pfade und JSON-Felder auf Deutsch, Felder in camelCase.
    - Zeitpunkte: ISO 8601 in UTC (z. B. "2027-01-05T17:00:00Z").
      Ausnahme: kursSerie.startzeit ist Wiener Ortszeit ("18:00"), Kalendertage sind "YYYY-MM-DD".
    - Geldbeträge in Cent (Integer).
    - Fehler immer als ProblemDetails (RFC 9457), Content-Type application/problem+json.
    - Anmeldung über HttpOnly-Cookie (SameSite=Strict, Secure).
    - CSRF: Jede POST/PUT/DELETE-Anfrage (außer Stripe-Webhook) sendet Header X-XSRF-TOKEN.
      Token holen über GET /api/v1/auth/csrf.
servers:
  - url: http://localhost:5000
    description: Lokale Entwicklung

tags:
  - name: Öffentlich
    description: Ohne Anmeldung (Kalender, Produkte)
  - name: Auth
    description: Registrieren, Anmelden, Abmelden, CSRF-Token
  - name: Ich
    description: Angemeldete Person (alle Rollen; Kauf und Buchung nur Rolle KUNDE)
  - name: Trainer
    description: Nur Rolle TRAINER, nur eigene Kurse
  - name: Admin
    description: Nur Rolle ADMIN
  - name: Stripe
    description: Nur für Stripe, nicht für das Frontend

security:
  - cookieAuth: []

paths:
  # ------------------------------------------------------------------ Öffentlich
  /api/v1/kurstermine:
    get:
      tags: [Öffentlich]
      summary: Kalender – Kurstermine in einem Zeitraum (US-05)
      operationId: kursterminListe
      security: []
      parameters:
        - $ref: '#/components/parameters/Von'
        - $ref: '#/components/parameters/Bis'
      responses:
        '200':
          description: Termine sortiert nach Beginn
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Kurstermin' }
        '400': { $ref: '#/components/responses/Validierungsfehler' }
  /api/v1/kurstermine/{id}:
    get:
      tags: [Öffentlich]
      summary: Details eines Kurstermins (US-05)
      operationId: kursterminDetails
      security: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Kurstermin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Kurstermin' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
  /api/v1/produkte:
    get:
      tags: [Öffentlich]
      summary: Aktive Produkte für den Shop (US-06)
      operationId: produktListe
      security: []
      responses:
        '200':
          description: Aktive Produkte
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Produkt' }
  /api/v1/kurstypen:
    get:
      tags: [Öffentlich]
      summary: Aktive Kurstypen
      operationId: kurstypListe
      security: []
      responses:
        '200':
          description: Kurstypen
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Kurstyp' }
  /api/v1/standorte:
    get:
      tags: [Öffentlich]
      summary: Aktive Standorte
      operationId: standortListe
      security: []
      responses:
        '200':
          description: Standorte
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Standort' }

  # ------------------------------------------------------------------ Auth
  /api/v1/auth/csrf:
    get:
      tags: [Auth]
      summary: CSRF-Token holen (vor der ersten POST/PUT/DELETE-Anfrage)
      operationId: csrfToken
      security: []
      responses:
        '200':
          description: Token für den Header X-XSRF-TOKEN
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
  /api/v1/auth/registrieren:
    post:
      tags: [Auth]
      summary: Konto als Kund:in anlegen und direkt anmelden (US-04)
      operationId: registrieren
      security: [ { csrfHeader: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrierenAnfrage' }
      responses:
        '201':
          description: Konto angelegt, Auth-Cookie gesetzt
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ich' }
        '400': { $ref: '#/components/responses/Validierungsfehler' }
        '409':
          description: E-Mail bereits vergeben (type .../email-vergeben)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
  /api/v1/auth/anmelden:
    post:
      tags: [Auth]
      summary: Anmelden (US-04)
      operationId: anmelden
      security: [ { csrfHeader: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnmeldenAnfrage' }
      responses:
        '200':
          description: Angemeldet, Auth-Cookie gesetzt
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ich' }
        '401':
          description: Allgemeine Meldung – verrät nicht, ob die E-Mail existiert
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '429':
          description: Zu viele Versuche (Rate Limiting)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
  /api/v1/auth/abmelden:
    post:
      tags: [Auth]
      summary: Abmelden, Cookie wird gelöscht
      operationId: abmelden
      security: [ { cookieAuth: [], csrfHeader: [] } ]
      responses:
        '204': { description: Abgemeldet }

  # ------------------------------------------------------------------ Ich
  /api/v1/ich:
    get:
      tags: [Ich]
      summary: Daten der angemeldeten Person (z. B. für Menü nach Rolle)
      operationId: ich
      responses:
        '200':
          description: Angemeldete Person
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ich' }
        '401': { $ref: '#/components/responses/NichtAngemeldet' }
  /api/v1/ich/passwort:
    put:
      tags: [Ich]
      summary: Eigenes Passwort ändern (Pflicht beim 1. Login von Trainer:innen, US-02)
      operationId: passwortAendern
      security: [ { cookieAuth: [], csrfHeader: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [altesPasswort, neuesPasswort]
              properties:
                altesPasswort: { type: string }
                neuesPasswort: { type: string, minLength: 8 }
      responses:
        '204': { description: 'Passwort geändert; mussPasswortAendern ist danach false' }
        '400': { $ref: '#/components/responses/Validierungsfehler' }
        '401': { $ref: '#/components/responses/NichtAngemeldet' }
  /api/v1/ich/guthaben:
    get:
      tags: [Ich]
      summary: Eigenes gültiges Guthaben pro Block (US-08)
      description: Nur Blöcke mit Resteinheiten > 0 und gueltigBis in der Zukunft, sortiert nach gueltigBis.
      operationId: meinGuthaben
      responses:
        '200':
          description: Guthaben-Blöcke
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Guthaben' }
        '401': { $ref: '#/components/responses/NichtAngemeldet' }
        '403': { $ref: '#/components/responses/KeineBerechtigung' }
  /api/v1/ich/buchungen:
    get:
      tags: [Ich]
      summary: Eigene Buchungen (US-08)
      operationId: meineBuchungen
      parameters:
        - name: zeitraum
          in: query
          schema: { type: string, enum: [kommend, vergangen], default: kommend }
      responses:
        '200':
          description: Buchungen, sortiert nach Beginn des Termins
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Buchung' }
        '401': { $ref: '#/components/responses/NichtAngemeldet' }
        '403': { $ref: '#/components/responses/KeineBerechtigung' }
    post:
      tags: [Ich]
      summary: Kurstermin mit Guthaben buchen (US-07)
      description: |
        Das Backend wählt automatisch den passenden Guthaben-Block, der zuerst abläuft.
        Ablauf in einer Transaktion: Termin sperren (SELECT ... FOR UPDATE), freie Plätze zählen,
        1 Einheit abziehen, Buchung anlegen.
      operationId: buchen
      security: [ { cookieAuth: [], csrfHeader: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kursterminId]
              properties:
                kursterminId: { type: integer, format: int64 }
      responses:
        '201':
          description: Gebucht
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Buchung' }
        '401': { $ref: '#/components/responses/NichtAngemeldet' }
        '403': { $ref: '#/components/responses/KeineBerechtigung' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409':
          description: bereits-gebucht | ausgebucht | kurs-abgesagt | kurs-vorbei
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '422':
          description: kein-guthaben (kein gültiger Block für diesen Kurstyp)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
  /api/v1/ich/kaeufe:
    post:
      tags: [Ich]
      summary: Produkt kaufen – startet Stripe Checkout (US-06)
      description: |
        Legt einen Kauf mit Status OFFEN an und liefert die Stripe-Zahlungsseite.
        Das Frontend leitet mit window.location auf checkoutUrl weiter.
        Guthaben entsteht erst, wenn der Stripe-Webhook die Zahlung bestätigt.
      operationId: kaufStarten
      security: [ { cookieAuth: [], csrfHeader: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [produktId]
              properties:
                produktId: { type: integer, format: int64 }
      responses:
        '201':
          description: Kauf angelegt
          content:
            application/json:
              schema:
                type: object
                required: [kaufId, checkoutUrl]
                properties:
                  kaufId: { type: integer, format: int64 }
                  checkoutUrl: { type: string, format: uri }
        '401': { $ref: '#/components/responses/NichtAngemeldet' }
        '403': { $ref: '#/components/responses/KeineBerechtigung' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
  /api/v1/ich/kaeufe/{id}:
    get:
      tags: [Ich]
      summary: Status eines eigenen Kaufs (Erfolgsseite fragt alle 2 s ab, max. 30 s)
      operationId: kaufStatus
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Kauf
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Kauf' }
        '401': { $ref: '#/components/responses/NichtAngemeldet' }
        '404':
          description: Nicht gefunden – auch wenn der Kauf einer anderen Person gehört
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  # ------------------------------------------------------------------ Trainer
  /api/v1/trainer/kurstermine:
    get:
      tags: [Trainer]
      summary: Eigene Kurstermine in einem Zeitraum
      operationId: trainerTerminListe
      parameters:
        - $ref: '#/components/parameters/Von'
        - $ref: '#/components/parameters/Bis'
      responses:
        '200':
          description: Eigene Termine
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Kurstermin' }
        '401': { $ref: '#/components/responses/NichtAngemeldet' }
        '403': { $ref: '#/components/responses/KeineBerechtigung' }
    post:
      tags: [Trainer]
      summary: Einzeltermin anlegen (ohne Serie, US-03)
      operationId: trainerTerminAnlegen
      security: [ { cookieAuth: [], csrfHeader: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KursterminEingabe' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Kurstermin' }
        '400': { $ref: '#/components/responses/Validierungsfehler' }
        '401': { $ref: '#/components/responses/NichtAngemeldet' }
        '403': { $ref: '#/components/responses/KeineBerechtigung' }
  /api/v1/trainer/kurstermine/{id}:
    put:
      tags: [Trainer]
      summary: Eigenen Kurstermin bearbeiten (US-03)
      operationId: trainerTerminBearbeiten
      security: [ { cookieAuth: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KursterminEingabe' }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Kurstermin' }
        '400': { $ref: '#/components/responses/Validierungsfehler' }
        '401': { $ref: '#/components/responses/NichtAngemeldet' }
        '403':
          description: Termin gehört einer anderen Trainer:in
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '422':
          description: max-teilnehmer-zu-klein (weniger als bereits gebucht)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
  /api/v1/trainer/kurs-serien:
    get:
      tags: [Trainer]
      summary: Eigene Kursserien
      operationId: trainerSerienListe
      responses:
        '200':
          description: Serien
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/KursSerie' }
        '401': { $ref: '#/components/responses/NichtAngemeldet' }
        '403': { $ref: '#/components/responses/KeineBerechtigung' }
    post:
      tags: [Trainer]
      summary: Wöchentliche Kursserie anlegen – Backend erzeugt alle Termine (US-03)
      description: Im MVP sind Serien danach nicht bearbeitbar, nur einzelne Termine oder Serie beenden.
      operationId: trainerSerieAnlegen
      security: [ { cookieAuth: [], csrfHeader: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/KursSerieEingabe' }
      responses:
        '201':
          description: Serie angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KursSerie' }
        '400': { $ref: '#/components/responses/Validierungsfehler' }
        '401': { $ref: '#/components/responses/NichtAngemeldet' }
        '403': { $ref: '#/components/responses/KeineBerechtigung' }
  /api/v1/trainer/kurs-serien/{id}/beenden:
    post:
      tags: [Trainer]
      summary: Eigene Serie vorzeitig beenden
      description: |
        Setzt gueltigBis und löscht zukünftige Termine nach diesem Tag, die keine Buchungen haben.
        Gibt es danach gebuchte Termine, antwortet die API mit 409 (Absagen kommt in Release 2).
      operationId: trainerSerieBeenden
      security: [ { cookieAuth: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [letzterTag]
              properties:
                letzterTag: { type: string, format: date, examples: ['2027-02-23'] }
      responses:
        '200':
          description: Serie beendet
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KursSerie' }
        '401': { $ref: '#/components/responses/NichtAngemeldet' }
        '403': { $ref: '#/components/responses/KeineBerechtigung' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '409':
          description: termine-mit-buchungen (nach letzterTag gibt es gebuchte Termine)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  # ------------------------------------------------------------------ Admin
  /api/v1/admin/kurstypen:
    post:
      tags: [Admin]
      summary: Kurstyp anlegen (US-01)
      operationId: adminKurstypAnlegen
      security: [ { cookieAuth: [], csrfHeader: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100, examples: ['Reformer'] }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Kurstyp' }
        '400': { $ref: '#/components/responses/Validierungsfehler' }
        '401': { $ref: '#/components/responses/NichtAngemeldet' }
        '403': { $ref: '#/components/responses/KeineBerechtigung' }
        '409':
          description: name-vergeben
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
  /api/v1/admin/produkte:
    get:
      tags: [Admin]
      summary: Alle Produkte inkl. inaktive
      operationId: adminProduktListe
      responses:
        '200':
          description: Produkte
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Produkt' }
        '401': { $ref: '#/components/responses/NichtAngemeldet' }
        '403': { $ref: '#/components/responses/KeineBerechtigung' }
    post:
      tags: [Admin]
      summary: Produkt anlegen (US-01)
      operationId: adminProduktAnlegen
      security: [ { cookieAuth: [], csrfHeader: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProduktEingabe' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Produkt' }
        '400': { $ref: '#/components/responses/Validierungsfehler' }
        '401': { $ref: '#/components/responses/NichtAngemeldet' }
        '403': { $ref: '#/components/responses/KeineBerechtigung' }
  /api/v1/admin/trainer:
    get:
      tags: [Admin]
      summary: Alle Trainer:innen
      operationId: adminTrainerListe
      responses:
        '200':
          description: Trainer:innen
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Ich' }
        '401': { $ref: '#/components/responses/NichtAngemeldet' }
        '403': { $ref: '#/components/responses/KeineBerechtigung' }
    post:
      tags: [Admin]
      summary: Trainer-Konto anlegen (US-02)
      description: Das Konto bekommt mussPasswortAendern = true.
      operationId: adminTrainerAnlegen
      security: [ { cookieAuth: [], csrfHeader: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrainerEingabe' }
      responses:
        '201':
          description: Angelegt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ich' }
        '400': { $ref: '#/components/responses/Validierungsfehler' }
        '401': { $ref: '#/components/responses/NichtAngemeldet' }
        '403': { $ref: '#/components/responses/KeineBerechtigung' }
        '409':
          description: email-vergeben
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
  /api/v1/admin/kurstermine/{id}:
    put:
      tags: [Admin]
      summary: Beliebigen Kurstermin bearbeiten (US-03, auch Trainer:in wechseln)
      operationId: adminTerminBearbeiten
      security: [ { cookieAuth: [], csrfHeader: [] } ]
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/KursterminEingabe'
                - type: object
                  required: [trainerId]
                  properties:
                    trainerId: { type: integer, format: int64 }
      responses:
        '200':
          description: Geändert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Kurstermin' }
        '400': { $ref: '#/components/responses/Validierungsfehler' }
        '401': { $ref: '#/components/responses/NichtAngemeldet' }
        '403': { $ref: '#/components/responses/KeineBerechtigung' }
        '404': { $ref: '#/components/responses/NichtGefunden' }
        '422':
          description: max-teilnehmer-zu-klein
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }

  # ------------------------------------------------------------------ Stripe
  /api/v1/stripe/webhook:
    post:
      tags: [Stripe]
      summary: Stripe meldet Zahlungsereignisse (checkout.session.completed u. a.)
      description: |
        Kein Login, kein CSRF-Token. Stattdessen prüft das Backend den Header Stripe-Signature
        mit dem Webhook-Secret. Idempotent: dieselbe Session wird nur einmal gutgeschrieben.
      operationId: stripeWebhook
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Stripe-Event (Format von Stripe vorgegeben) }
      responses:
        '200': { description: Verarbeitet oder bereits verarbeitet }
        '400': { description: Signatur ungültig }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: TrainTone.Auth
      description: HttpOnly, Secure, SameSite=Strict; wird bei Registrieren/Anmelden gesetzt.
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
      description: Token aus GET /api/v1/auth/csrf, Pflicht bei POST/PUT/DELETE.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Von:
      name: von
      in: query
      required: true
      description: Erster Tag (inklusive), Wiener Kalendertag
      schema: { type: string, format: date, examples: ['2027-01-04'] }
    Bis:
      name: bis
      in: query
      required: true
      description: Letzter Tag (inklusive), max. 31 Tage nach von
      schema: { type: string, format: date, examples: ['2027-01-10'] }

  responses:
    Validierungsfehler:
      description: Eingabe ungültig, errors enthält die Fehler pro Feld
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblemDetails' }
    NichtAngemeldet:
      description: Nicht angemeldet
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    KeineBerechtigung:
      description: Angemeldet, aber falsche Rolle
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NichtGefunden:
      description: Nicht gefunden
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }

  schemas:
    ProblemDetails:
      type: object
      description: RFC 9457
      properties:
        type: { type: string, examples: ['https://traintone.at/probleme/ausgebucht'] }
        title: { type: string, examples: ['Kurs ist ausgebucht'] }
        status: { type: integer, examples: [409] }
        detail: { type: string, examples: ['Für diesen Termin ist kein Platz mehr frei.'] }
        instance: { type: string }
    ValidationProblemDetails:
      allOf:
        - $ref: '#/components/schemas/ProblemDetails'
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
              examples:
                - { preisCent: ['Preis muss größer als 0 sein.'] }

    Rolle:
      type: string
      enum: [KUNDE, TRAINER, ADMIN]

    Ich:
      type: object
      required: [id, vorname, nachname, email, rolle, mussPasswortAendern]
      properties:
        id: { type: integer, format: int64 }
        vorname: { type: string }
        nachname: { type: string }
        email: { type: string, format: email }
        telefon: { type: [string, 'null'] }
        rolle: { $ref: '#/components/schemas/Rolle' }
        mussPasswortAendern: { type: boolean }

    RegistrierenAnfrage:
      type: object
      required: [vorname, nachname, email, telefon, passwort]
      properties:
        vorname: { type: string, maxLength: 100 }
        nachname: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        telefon: { type: string, maxLength: 30 }
        passwort: { type: string, minLength: 8 }
    AnmeldenAnfrage:
      type: object
      required: [email, passwort]
      properties:
        email: { type: string, format: email }
        passwort: { type: string }
    TrainerEingabe:
      type: object
      required: [vorname, nachname, email, telefon, startpasswort]
      properties:
        vorname: { type: string, maxLength: 100 }
        nachname: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 255 }
        telefon: { type: string, maxLength: 30 }
        startpasswort: { type: string, minLength: 8 }

    Referenz:
      type: object
      description: Kurzform eines verknüpften Objekts
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
    TrainerOeffentlich:
      type: object
      description: Öffentlich nur Vorname (Datenminimierung, DSGVO)
      required: [id, vorname]
      properties:
        id: { type: integer, format: int64 }
        vorname: { type: string }

    Kurstyp:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, examples: ['Reformer'] }
    Standort:
      type: object
      required: [id, name, adresse]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        adresse: { type: string }

    Produkt:
      type: object
      required: [id, name, preisCent, einheiten, gueltigkeitTage, kurstypen, istAktiv]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, examples: ['Block 10'] }
        preisCent: { type: integer, examples: [25000] }
        einheiten: { type: integer, enum: [1, 3, 10] }
        gueltigkeitTage: { type: integer, examples: [180] }
        kurstypen:
          type: array
          items: { $ref: '#/components/schemas/Referenz' }
        istAktiv: { type: boolean }
    ProduktEingabe:
      type: object
      required: [name, preisCent, einheiten, gueltigkeitTage, kurstypIds]
      properties:
        name: { type: string, maxLength: 100 }
        preisCent: { type: integer, minimum: 1 }
        einheiten: { type: integer, enum: [1, 3, 10] }
        gueltigkeitTage: { type: integer, minimum: 1 }
        kurstypIds:
          type: array
          minItems: 1
          items: { type: integer, format: int64 }

    Kurstermin:
      type: object
      required: [id, name, kurstyp, standort, trainer, beginn, dauerMin, maxTeilnehmer, freiePlaetze, status, buchbar]
      properties:
        id: { type: integer, format: int64 }
        kursSerieId: { type: [integer, 'null'], format: int64 }
        name: { type: string, examples: ['Reformer am Abend'] }
        kurstyp: { $ref: '#/components/schemas/Referenz' }
        standort: { $ref: '#/components/schemas/Referenz' }
        trainer: { $ref: '#/components/schemas/TrainerOeffentlich' }
        beginn: { type: string, format: date-time, examples: ['2027-01-05T17:00:00Z'] }
        dauerMin: { type: integer, examples: [50] }
        maxTeilnehmer: { type: integer, examples: [8] }
        freiePlaetze: { type: integer, examples: [3] }
        status: { type: string, enum: [GEPLANT, ABGESAGT] }
        buchbar:
          type: boolean
          description: true, wenn GEPLANT, Beginn in der Zukunft und freiePlaetze > 0
    KursterminEingabe:
      type: object
      required: [name, kurstypId, standortId, beginn, dauerMin, maxTeilnehmer]
      properties:
        name: { type: string, maxLength: 100 }
        kurstypId: { type: integer, format: int64 }
        standortId: { type: integer, format: int64 }
        beginn: { type: string, format: date-time, description: In der Zukunft, UTC }
        dauerMin: { type: integer, minimum: 1 }
        maxTeilnehmer: { type: integer, minimum: 1 }

    KursSerie:
      type: object
      required: [id, name, kurstyp, standort, wochentag, startzeit, dauerMin, maxTeilnehmer, gueltigVon, gueltigBis, anzahlTermine]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kurstyp: { $ref: '#/components/schemas/Referenz' }
        standort: { $ref: '#/components/schemas/Referenz' }
        wochentag: { type: integer, minimum: 1, maximum: 7, description: '1 = Montag' }
        startzeit: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: Wiener Ortszeit, examples: ['18:00'] }
        dauerMin: { type: integer }
        maxTeilnehmer: { type: integer }
        gueltigVon: { type: string, format: date }
        gueltigBis: { type: string, format: date }
        anzahlTermine: { type: integer, description: Anzahl erzeugter Termine }
    KursSerieEingabe:
      type: object
      required: [name, kurstypId, standortId, wochentag, startzeit, dauerMin, maxTeilnehmer, gueltigVon, gueltigBis]
      properties:
        name: { type: string, maxLength: 100 }
        kurstypId: { type: integer, format: int64 }
        standortId: { type: integer, format: int64 }
        wochentag: { type: integer, minimum: 1, maximum: 7 }
        startzeit: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', examples: ['18:00'] }
        dauerMin: { type: integer, minimum: 1 }
        maxTeilnehmer: { type: integer, minimum: 1 }
        gueltigVon: { type: string, format: date, description: Nicht in der Vergangenheit }
        gueltigBis: { type: string, format: date, description: 'Nach gueltigVon, max. 6 Monate später' }

    Kauf:
      type: object
      required: [id, produktName, preisCent, einheiten, status, erstelltAm]
      properties:
        id: { type: integer, format: int64 }
        produktName: { type: string }
        preisCent: { type: integer }
        einheiten: { type: integer }
        status: { type: string, enum: [OFFEN, BEZAHLT, FEHLGESCHLAGEN, ABGEBROCHEN] }
        erstelltAm: { type: string, format: date-time }
        bezahltAm: { type: [string, 'null'], format: date-time }
    Guthaben:
      type: object
      required: [id, produktName, einheitenGesamt, einheitenRest, gueltigBis, kurstypen]
      properties:
        id: { type: integer, format: int64 }
        produktName: { type: string, examples: ['Block 10'] }
        einheitenGesamt: { type: integer, examples: [10] }
        einheitenRest: { type: integer, examples: [7] }
        gueltigBis: { type: string, format: date-time }
        kurstypen:
          type: array
          items: { $ref: '#/components/schemas/Referenz' }
    Buchung:
      type: object
      required: [id, status, erstelltAm, kurstermin]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [AKTIV, STORNIERT, KURS_ABGESAGT] }
        erstelltAm: { type: string, format: date-time }
        kurstermin: { $ref: '#/components/schemas/Kurstermin' }
